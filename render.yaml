services:
  - type: web
    name: sante-app-backend
    env: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sante-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: sante-db
    databaseName: sante_db
    user: sante_user