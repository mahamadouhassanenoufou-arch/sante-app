            </div>

            <div>
                <label for="details" class="block text-sm font-medium text-slate-700 mb-1">Détails / Notes</label>

            </div>

            <button type="submit" 
                    class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-semibold rounded-xl shadow-md transition-all duration-150">
                Enregistrer
            </button>
        </form>
    </div>

    <script src="/static/app.js"></script>
