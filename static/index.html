<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantéApp - Gestion de Rendez-vous</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- NAVBAR -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <h1 class="text-2xl font-bold tracking-tight">SantéApp</h1>
                <span class="bg-indigo-700 text-indigo-200 text-xs px-2.5 py-1 rounded-full font-medium">Espace Sécurisé</span>
            </div>
            <div id="userInfoHeader" class="hidden flex items-center space-x-4">
                <div class="text-right">
                    <p id="userFullName" class="font-semibold text-sm text-white"></p>
                    <p id="userRoleBadge" class="text-xs text-indigo-200"></p>
                </div>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition">
                    Déconnexion
                </button>
            </div>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-6 py-8">

        <!-- AUTHENTIFICATION (LOGIN / REGISTER) -->
        <section id="authSection" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
            <h2 id="authTitle" class="text-2xl font-bold text-slate-900 text-center mb-6">Connexion</h2>
            
            <form id="authForm" onsubmit="handleAuth(event)">
                <div id="registerFields" class="hidden space-y-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nom</label>
                        <input type="text" id="regNom" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Prénom</label>
                        <input type="text" id="regPrenom" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Rôle</label>
                        <select id="regRole" onchange="toggleSpecialite()" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="PATIENT">Patient</option>
                            <option value="MEDECIN">Médecin / Praticien</option>
                        </select>
                    </div>
                    <div id="specialiteGroup" class="hidden">
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Spécialité</label>
                        <input type="text" id="regSpecialite" placeholder="Ex: Généraliste, Cardiologue" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Adresse Email</label>
                        <input type="email" id="authEmail" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mot de passe</label>
                        <input type="password" id="authPassword" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <button type="submit" id="authSubmitBtn" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow transition">
                    Se connecter
                </button>
            </form>

            <div class="mt-4 text-center">
                <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-sm text-indigo-600 hover:underline">
                    Pas encore de compte ? S'inscrire
                </button>
            </div>
        </section>

        <!-- DASHBOARD PATIENT -->
        <section id="patientDashboard" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Formulaire de Prise de RDV -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                <h3 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b">Prendre RDV auprès d'un Spécialiste</h3>
                <form onsubmit="submitPatientRdv(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Choisir un Médecin</label>
                        <select id="medecinSelect" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="">Chargement des médecins...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Motif de consultation</label>
                        <input type="text" id="motifInput" placeholder="Ex: Fièvre, rhume, consultation générale..." required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">
                        Confirmer le Rendez-vous
                    </button>
                </form>
            </div>

            <!-- Historique / Mes RDV -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                <h3 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b">Mon Historique Médical</h3>
                <div id="patientRdvList" class="space-y-4">
                    <p class="text-slate-500 text-sm">Chargement de votre historique...</p>
                </div>
            </div>
        </section>

        <!-- DASHBOARD MEDECIN -->
        <section id="medecinDashboard" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Liste des RDV attribués -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                <div class="flex justify-between items-center mb-4 pb-2 border-b">
                    <h3 class="text-lg font-bold text-slate-900">Mes Rendez-vous attribués</h3>
                    <button onclick="loadMedecinRdvs()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded transition">
                        ↻ Actualiser
                    </button>
                </div>
                <div id="medecinRdvList" class="space-y-4">
                    <p class="text-slate-500 text-sm">Chargement des rendez-vous...</p>
                </div>
            </div>

            <!-- Saisie du Dossier de Consultation -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                <h3 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b">Dossier de Consultation</h3>
                <form id="consultationForm" onsubmit="submitConsultation(event)" class="space-y-4">
                    <input type="hidden" id="selectedRdvId">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Patient</label>
                        <input type="text" id="selectedPatientName" disabled readonly placeholder="Sélectionnez un RDV à gauche" class="w-full bg-slate-100 border border-slate-300 rounded-lg p-3 text-sm text-slate-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Symptômes constatés</label>
                        <textarea id="symptomesInput" required rows="3" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Diagnostic Médical</label>
                        <textarea id="diagnosticInput" required rows="3" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Prescription / Ordonnance</label>
                        <textarea id="prescriptionInput" rows="3" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                    </div>
                    <button type="submit" id="saveConsultBtn" disabled class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-semibold py-3 rounded-lg transition">
                        Valider et enregistrer la consultation
                    </button>
                </form>
            </div>
        </section>

    </main>

    <script>
        let isRegisterMode = false;

        document.addEventListener("DOMContentLoaded", () => {
            checkAuth();
        });

        function checkAuth() {
            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");
            const nom = localStorage.getItem("nom");
            const prenom = localStorage.getItem("prenom");

            if (token && role) {
                document.getElementById("authSection").classList.add("hidden");
                document.getElementById("userInfoHeader").classList.remove("hidden");
                document.getElementById("userFullName").textContent = `${prenom} ${nom}`;
                document.getElementById("userRoleBadge").textContent = role === "MEDECIN" ? "Médecin / Praticien" : "Patient";

                if (role === "PATIENT") {
                    document.getElementById("patientDashboard").classList.remove("hidden");
                    document.getElementById("medecinDashboard").classList.add("hidden");
                    loadMedecinsList();
                    loadPatientRdvs();
                } else if (role === "MEDECIN") {
                    document.getElementById("medecinDashboard").classList.remove("hidden");
                    document.getElementById("patientDashboard").classList.add("hidden");
                    loadMedecinRdvs();
                }
            } else {
                document.getElementById("authSection").classList.remove("hidden");
                document.getElementById("userInfoHeader").classList.add("hidden");
                document.getElementById("patientDashboard").classList.add("hidden");
                document.getElementById("medecinDashboard").classList.add("hidden");
            }
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById("authTitle").textContent = isRegisterMode ? "Inscription" : "Connexion";
            document.getElementById("authSubmitBtn").textContent = isRegisterMode ? "S'inscrire" : "Se connecter";
            document.getElementById("toggleAuthBtn").textContent = isRegisterMode ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
            document.getElementById("registerFields").classList.toggle("hidden", !isRegisterMode);
        }

        function toggleSpecialite() {
            const role = document.getElementById("regRole").value;
            document.getElementById("specialiteGroup").classList.toggle("hidden", role !== "MEDECIN");
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById("authEmail").value;
            const password = document.getElementById("authPassword").value;

            if (isRegisterMode) {
                const nom = document.getElementById("regNom").value;
                const prenom = document.getElementById("regPrenom").value;
                const role = document.getElementById("regRole").value;
                const specialite = document.getElementById("regSpecialite").value;

                const res = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nom, prenom, email, password, role, specialite })
                });

                if (res.ok) {
                    alert("Compte créé avec succès ! Connectez-vous.");
                    toggleAuthMode();
                } else {
                    const err = await res.json();
                    alert("Erreur : " + (err.detail || "Inscription échouée"));
                }
            } else {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem("token", data.access_token);
                    localStorage.setItem("role", data.role);
                    localStorage.setItem("nom", data.nom);
                    localStorage.setItem("prenom", data.prenom);
                    checkAuth();
                } else {
                    const err = await res.json();
                    alert("Erreur : " + (err.detail || "Identifiants invalides"));
                }
            }
        }

        function logout() {
            localStorage.clear();
            checkAuth();
        }

        // --- PATIENT ---
        async function loadMedecinsList() {
            const res = await fetch("/api/patient/medecins");
            if (res.ok) {
                const medecins = await res.json();
                const select = document.getElementById("medecinSelect");
                select.innerHTML = medecins.map(m => 
                    `<option value="${m.id}">Dr. ${m.prenom} ${m.nom} (${m.specialite})</option>`
                ).join('');
            }
        }

        async function submitPatientRdv(event) {
            event.preventDefault();
            const medecinId = document.getElementById("medecinSelect").value;
            const motif = document.getElementById("motifInput").value.trim();
            const token = localStorage.getItem("token");

            if (!medecinId || !motif) {
                alert("Veuillez remplir tous les champs.");
                return;
            }

            const res = await fetch("/api/patient/rdv", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ medecin_id: parseInt(medecinId), motif: motif })
            });

            if (res.ok) {
                alert("Rendez-vous enregistré avec succès !");
                document.getElementById("motifInput").value = "";
                loadPatientRdvs();
            } else {
                const err = await res.json();
                alert("Erreur : " + (err.detail || "Erreur de réservation"));
            }
        }

        async function loadPatientRdvs() {
            const token = localStorage.getItem("token");
            const res = await fetch("/api/patient/my-rdv", {
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (res.ok) {
                const rdvs = await res.json();
                const container = document.getElementById("patientRdvList");

                if (rdvs.length === 0) {
                    container.innerHTML = `<p class="text-slate-500 text-sm">Aucun rendez-vous dans votre dossier.</p>`;
                    return;
                }

                container.innerHTML = rdvs.map(r => `
                    <div class="p-4 border border-slate-200 rounded-lg bg-slate-50">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-slate-800">${r.medecin_nom}</h4>
                                <p class="text-xs text-indigo-600 font-semibold">${r.specialite}</p>
                            </div>
                            <span class="text-xs px-2 py-1 rounded font-bold ${r.statut === 'TERMINE' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                ${r.statut}
                            </span>
                        </div>
                        <p class="text-sm mt-2"><strong class="text-slate-600">Motif:</strong> ${r.motif}</p>
                        ${r.diagnostic ? `
                            <div class="mt-3 pt-3 border-t border-slate-200 text-xs text-slate-700 space-y-1">
                                <p><strong>Symptômes:</strong> ${r.symptomes}</p>
                                <p><strong>Diagnostic:</strong> ${r.diagnostic}</p>
                                <p><strong>Ordonnance:</strong> ${r.prescription || 'Aucune'}</p>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }
        }

        // --- MEDECIN ---
        async function loadMedecinRdvs() {
            const token = localStorage.getItem("token");
            const res = await fetch("/api/medecin/rdv", {
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (res.ok) {
                const rdvs = await res.json();
                const container = document.getElementById("medecinRdvList");

                if (rdvs.length === 0) {
                    container.innerHTML = `<p class="text-slate-500 text-sm">Aucun rendez-vous attribué.</p>`;
                    return;
                }

                container.innerHTML = rdvs.map(r => `
                    <div class="p-4 border border-slate-200 rounded-lg bg-slate-50 flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-slate-800">${r.prenom_patient} ${r.nom_patient}</h4>
                            <p class="text-xs text-slate-600">Motif : ${r.motif}</p>
                            <span class="inline-block mt-1 text-xs px-2 py-0.5 rounded font-semibold ${r.statut === 'TERMINE' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                ${r.statut}
                            </span>
                        </div>
                        ${r.statut !== 'TERMINE' ? `
                            <button onclick="selectRdvForConsultation(${r.id}, '${r.prenom_patient} ${r.nom_patient}')" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded transition">
                                Consulter
                            </button>
                        ` : ''}
                    </div>
                `).join('');
            }
        }

        function selectRdvForConsultation(rdvId, patientName) {
            document.getElementById("selectedRdvId").value = rdvId;
            document.getElementById("selectedPatientName").value = patientName;
            document.getElementById("saveConsultBtn").disabled = false;
        }

        async function submitConsultation(event) {
            event.preventDefault();
            const rdvId = document.getElementById("selectedRdvId").value;
            const symptomes = document.getElementById("symptomesInput").value.trim();
            const diagnostic = document.getElementById("diagnosticInput").value.trim();
            const prescription = document.getElementById("prescriptionInput").value.trim();
            const token = localStorage.getItem("token");

            if (!rdvId) {
                alert("Veuillez sélectionner un rendez-vous dans la liste de gauche.");
                return;
            }

            const res = await fetch("/api/medecin/consultation", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    rdv_id: parseInt(rdvId),
                    symptomes,
                    diagnostic,
                    prescription
                })
            });

            if (res.ok) {
                alert("Consultation enregistrée avec succès !");
                document.getElementById("consultationForm").reset();
                document.getElementById("saveConsultBtn").disabled = true;
                loadMedecinRdvs();
            } else {
                const err = await res.json();
                alert("Erreur : " + (err.detail || "Enregistrement impossible"));
            }
        }
    </script>
</body>
</html>
