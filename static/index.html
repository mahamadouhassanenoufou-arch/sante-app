<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantéApp - PWA Santé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/static/manifest.json">
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 font-sans flex flex-col justify-between">

    <!-- En-tête -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-sky-500 flex items-center justify-center text-white font-bold text-xl">S</div>
            <div>
                <h1 class="text-lg font-bold">SantéApp</h1>
                <p class="text-xs text-sky-400">PWA Santé</p>
            </div>
        </div>
        <button id="btn-logout" onclick="logout()" class="hidden text-sm bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg transition">Déconnexion</button>
    </header>

    <!-- Conteneur principal -->
    <main class="container mx-auto p-4 max-w-lg flex-1 flex flex-col justify-center">

        <!-- Formulaires Connexion / Inscription -->
        <div id="auth-section" class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
            <div class="flex border-b border-slate-700 mb-6">
                <button id="tab-login" onclick="switchTab('login')" class="w-1/2 pb-3 font-semibold text-center text-sky-400 border-b-2 border-sky-400">Connexion</button>
                <button id="tab-register" onclick="switchTab('register')" class="w-1/2 pb-3 font-semibold text-center text-slate-400">Créer un Compte</button>
            </div>

            <!-- Formulaire Connexion -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Email</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Mot de Passe</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-sky-500">
                </div>
                <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-lg transition">Se Connecter</button>
            </form>

            <!-- Formulaire Inscription -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs uppercase text-slate-400 mb-1">Nom</label>
                        <input type="text" id="reg-nom" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-slate-400 mb-1">Prénom</label>
                        <input type="text" id="reg-prenom" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Email</label>
                    <input type="email" id="reg-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Mot de Passe</label>
                    <input type="password" id="reg-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Rôle</label>
                    <select id="reg-role" onchange="toggleRoleFields()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
                        <option value="PATIENT">Patient</option>
                        <option value="MEDECIN">Médecin / Praticien</option>
                    </select>
                </div>

                <!-- Champs Patient -->
                <div id="patient-fields" class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <input type="text" id="reg-sang" placeholder="Groupe sanguin (ex: A+)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white text-sm">
                        </div>
                        <div>
                            <input type="text" id="reg-allergies" placeholder="Allergies" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white text-sm">
                        </div>
                    </div>
                    <textarea id="reg-antecedents" placeholder="Antécédents médicaux" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white text-sm h-16"></textarea>
                </div>

                <!-- Champs Médecin -->
                <div id="medecin-fields" class="hidden space-y-3">
                    <input type="text" id="reg-lieu" placeholder="Lieu d'exercice (ex: Hôpital National Niamey)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white text-sm">
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-lg transition">Créer mon Compte</button>
            </form>
        </div>

        <!-- Zone Tableau de Bord -->
        <div id="dashboard-section" class="hidden space-y-6">
            <div id="user-info" class="bg-slate-800 p-6 rounded-2xl border border-slate-700"></div>
        </div>

    </main>

    <script>
        let currentUser = null;

        function switchTab(tab) {
            const loginForm = document.getElementById("form-login");
            const regForm = document.getElementById("form-register");
            const tabLogin = document.getElementById("tab-login");
            const tabReg = document.getElementById("tab-register");

            if (tab === "login") {
                loginForm.classList.remove("hidden");
                regForm.classList.add("hidden");
                tabLogin.className = "w-1/2 pb-3 font-semibold text-center text-sky-400 border-b-2 border-sky-400";
                tabReg.className = "w-1/2 pb-3 font-semibold text-center text-slate-400";
            } else {
                loginForm.classList.add("hidden");
                regForm.classList.remove("hidden");
                tabReg.className = "w-1/2 pb-3 font-semibold text-center text-emerald-400 border-b-2 border-emerald-400";
                tabLogin.className = "w-1/2 pb-3 font-semibold text-center text-slate-400";
            }
        }

        function toggleRoleFields() {
            const role = document.getElementById("reg-role").value;
            const patientFields = document.getElementById("patient-fields");
            const medecinFields = document.getElementById("medecin-fields");

            if (role === "PATIENT") {
                patientFields.classList.remove("hidden");
                medecinFields.classList.add("hidden");
            } else {
                patientFields.classList.add("hidden");
                medecinFields.classList.remove("hidden");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const payload = {
                email: document.getElementById("login-email").value,
                password: document.getElementById("login-password").value
            };

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Erreur lors de la connexion");

                currentUser = data;
                localStorage.setItem("user", JSON.stringify(data));
                initDashboard();
            } catch (err) {
                alert(err.message);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const payload = {
                nom: document.getElementById("reg-nom").value,
                prenom: document.getElementById("reg-prenom").value,
                email: document.getElementById("reg-email").value,
                password: document.getElementById("reg-password").value,
                role: document.getElementById("reg-role").value,
                lieu_exercice: document.getElementById("reg-lieu").value || null,
                groupe_sanguin: document.getElementById("reg-sang").value || null,
                allergies: document.getElementById("reg-allergies").value || null,
                antecedents: document.getElementById("reg-antecedents").value || null
            };

            try {
                const res = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Erreur d'inscription");

                alert("Compte créé avec succès ! Veuillez vous connecter.");
                switchTab("login");
            } catch (err) {
                alert(err.message);
            }
        }

        function initDashboard() {
            document.getElementById("auth-section").classList.add("hidden");
            document.getElementById("dashboard-section").classList.remove("hidden");
            document.getElementById("btn-logout").classList.remove("hidden");

            const info = document.getElementById("user-info");
            info.innerHTML = `
                <h2 class="text-xl font-bold text-sky-400">Bienvenue, ${currentUser.prenom} ${currentUser.nom}</h2>
                <p class="text-sm text-slate-300 mt-1">Rôle : <span class="font-bold text-white">${currentUser.role}</span></p>
                ${currentUser.carte_digitale_id ? `<p class="text-sm text-emerald-400 mt-2 font-mono">Carte NID : ${currentUser.carte_digitale_id}</p>` : ''}
            `;
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        window.onload = () => {
            const saved = localStorage.getItem("user");
            if (saved) {
                currentUser = JSON.parse(saved);
                initDashboard();
            }
        };
    </script>
</body>
</html>
