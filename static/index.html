<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santé App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Barre de Navigation -->
    <nav class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Santé App</h1>
        
        <div id="nav-actions" class="flex items-center gap-4">
            <!-- Bouton pour basculer en mode Médecin / Admin -->
            <button id="btn-pro-login" onclick="showProLogin()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium text-sm">
                Accès Médecin / Admin
            </button>

            <!-- Info Utilisateur Connecté (Médecin / Admin) -->
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="user-display" class="font-semibold text-gray-700"></span>
                <button onclick="logout()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-8 p-4">

        <!-- Formulaire de Connexion SÉCURISÉ (Médecins & Admin uniquement) -->
        <div id="auth-container" class="hidden max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">Connexion Pro (Médecin / Admin)</h2>
                <button onclick="cancelProLogin()" class="text-gray-500 hover:text-gray-700 font-bold">✕</button>
            </div>
            
            <!-- Note explicative pour éviter que le navigateur propose la saisie auto Windows -->
            <p class="text-xs text-gray-500 mb-4">Réservé aux praticiens et administrateurs autorisés.</p>

            <form onsubmit="handleAuth(event)" class="space-y-4" autocomplete="off">
                <div>
                    <label class="block text-sm font-medium">Email professionnel</label>
                    <input type="email" id="email" required autocomplete="username" class="w-full border p-2 rounded focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium">Mot de passe</label>
                    <input type="password" id="password" required autocomplete="current-password" class="w-full border p-2 rounded focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded font-bold hover:bg-indigo-700">Se connecter</button>
            </form>
        </div>

        <!-- Dashboard Médecin / Admin (Masqué par défaut) -->
        <div id="medecin-dashboard" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-800">Rendez-vous à honorer</h3>
                    <button onclick="loadMedecinData()" class="px-3 py-1 text-sm bg-gray-200 rounded hover:bg-gray-300">↻ Actualiser</button>
                </div>
                <div id="rdv-list" class="space-y-3"></div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Nouvelle Consultation</h3>
                <form onsubmit="submitConsultation(event)" class="space-y-4">
                    <input type="hidden" id="consult-rdv-id">
                    <div>
                        <label class="block text-sm font-medium">Patient</label>
                        <input type="text" id="consult-patient-name" disabled class="w-full border p-2 rounded bg-gray-100">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Symptômes</label>
                        <textarea id="consult-symptomes" required class="w-full border p-2 rounded h-20"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Diagnostic</label>
                        <textarea id="consult-diagnostic" required class="w-full border p-2 rounded h-20"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Prescription / Ordonnance</label>
                        <textarea id="consult-prescription" class="w-full border p-2 rounded h-20"></textarea>
                    </div>
                    <button type="submit" id="btn-save-consult" disabled class="w-full bg-green-700 text-white p-2 rounded hover:bg-green-800 disabled:opacity-50 font-bold">Enregistrer la consultation</button>
                </form>
            </div>
        </div>

        <!-- Espace Patient (Accessible Librement & Directement) -->
        <div id="patient-dashboard" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Prendre un Rendez-vous</h3>
                <form onsubmit="submitPatientRdv(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium">Votre Nom complet</label>
                        <input type="text" id="patient-nom-invite" required class="w-full border p-2 rounded" placeholder="Ex: Hassan Noufou">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Médecin & Spécialité</label>
                        <select id="select-medecin" required class="w-full border p-2 rounded"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Motif de consultation</label>
                        <input type="text" id="patient-motif" required class="w-full border p-2 rounded" placeholder="Ex: Fièvre, Bilan de santé...">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700">Valider le rendez-vous</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Rendez-vous enregistrés</h3>
                <div id="patient-rdv-list" class="space-y-3"></div>
            </div>
        </div>

    </div>

    <script>
        function checkAuth() {
            const token = localStorage.getItem('token');
            const role = (localStorage.getItem('role') || '').toUpperCase();
            const nom = localStorage.getItem('nom') || '';
            const prenom = localStorage.getItem('prenom') || '';

            // Par défaut
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('medecin-dashboard').classList.add('hidden');
            document.getElementById('btn-pro-login').classList.remove('hidden');
            document.getElementById('user-info').classList.add('hidden');
            
            // L'espace patient reste visible par défaut
            document.getElementById('patient-dashboard').classList.remove('hidden');
            loadPatientData();

            // Si c'est un Médecin ou un Admin connecté
            if (token && (role === 'MEDECIN' || role === 'ADMIN')) {
                document.getElementById('btn-pro-login').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-display').innerText = `Dr. ${prenom} ${nom}`.trim();

                document.getElementById('patient-dashboard').classList.add('hidden');
                document.getElementById('medecin-dashboard').classList.remove('hidden');
                loadMedecinData();
            }
        }

        function showProLogin() {
            document.getElementById('auth-container').classList.remove('hidden');
        }

        function cancelProLogin() {
            document.getElementById('auth-container').classList.add('hidden');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    if (data.role === 'MEDECIN' || data.role === 'ADMIN') {
                        localStorage.setItem('token', data.access_token);
                        localStorage.setItem('role', data.role);
                        localStorage.setItem('nom', data.nom || '');
                        localStorage.setItem('prenom', data.prenom || '');
                        checkAuth();
                    } else {
                        alert("Accès refusé. Cet espace est réservé aux médecins et administrateurs.");
                    }
                } else {
                    alert(data.detail || "Identifiants incorrects.");
                }
            } catch (err) {
                alert("Erreur réseau : " + err.message);
            }
        }

        function logout() {
            localStorage.clear();
            checkAuth();
        }

        async function loadPatientData() {
            const resMed = await fetch('/api/patient/medecins');
            const medecins = await resMed.json();
            const selectMed = document.getElementById('select-medecin');

            if (medecins.length === 0) {
                selectMed.innerHTML = '<option value="">Aucun médecin disponible</option>';
            } else {
                selectMed.innerHTML = medecins.map(m => 
                    `<option value="${m.id}">Dr. ${m.prenom} ${m.nom} (${m.specialite})</option>`
                ).join('');
            }

            const resRdv = await fetch('/api/patient/my-rdv');
            const rdvs = await resRdv.json();
            const list = document.getElementById('patient-rdv-list');
            list.innerHTML = rdvs.length === 0 ? '<p class="text-gray-500 text-sm">Aucun rendez-vous enregistré.</p>' : '';

            rdvs.forEach(r => {
                const card = document.createElement('div');
                card.className = "p-4 border rounded-lg bg-white shadow-sm space-y-2";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold">Motif : ${r.motif}</span>
                        <span class="px-2 py-1 text-xs rounded ${r.statut === 'TERMINE' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${r.statut}</span>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        async function submitPatientRdv(e) {
            e.preventDefault();
            const medecin_id = parseInt(document.getElementById('select-medecin').value);
            const motif = document.getElementById('patient-motif').value;
            const nom_patient = document.getElementById('patient-nom-invite').value;

            const res = await fetch('/api/patient/rdv', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ medecin_id, motif, nom_patient })
            });

            if (res.ok) {
                alert("Rendez-vous enregistré avec succès !");
                document.getElementById('patient-motif').value = '';
                loadPatientData();
            }
        }

        async function loadMedecinData() {
            const token = localStorage.getItem('token');
            const res = await fetch('/api/medecin/rdv', { headers: { 'Authorization': `Bearer ${token}` } });
            if (!res.ok) return;
            const rdvs = await res.json();
            const listContainer = document.getElementById('rdv-list');
            listContainer.innerHTML = rdvs.length === 0 ? '<p class="text-gray-500 text-sm">Aucun RDV en attente.</p>' : '';

            rdvs.forEach(rdv => {
                const isTermine = rdv.statut === 'TERMINE';
                const card = document.createElement('div');
                card.className = `p-4 border rounded-lg flex justify-between items-center ${isTermine ? 'bg-gray-50 opacity-75' : 'bg-white shadow-sm'}`;
                card.innerHTML = `
                    <div>
                        <h4 class="font-bold">${rdv.prenom_patient || ''} ${rdv.nom_patient || 'Patient'}</h4>
                        <p class="text-sm text-gray-600">Motif : ${rdv.motif}</p>
                        <span class="inline-block px-2 py-1 text-xs font-semibold rounded ${isTermine ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${rdv.statut}</span>
                    </div>
                    ${!isTermine ? `<button onclick="selectRdv(${rdv.id}, '${rdv.nom_patient || 'Patient'}')" class="px-3 py-1 bg-blue-600 text-white text-sm rounded">Consulter</button>` : '<span class="text-xs text-green-600 font-semibold">Terminé</span>'}
                `;
                listContainer.appendChild(card);
            });
        }

        function selectRdv(id, name) {
            document.getElementById('consult-rdv-id').value = id;
            document.getElementById('consult-patient-name').value = name;
            document.getElementById('btn-save-consult').disabled = false;
        }

        async function submitConsultation(e) {
            e.preventDefault();
            const rdv_id = parseInt(document.getElementById('consult-rdv-id').value);
            const symptomes = document.getElementById('consult-symptomes').value;
            const diagnostic = document.getElementById('consult-diagnostic').value;
            const prescription = document.getElementById('consult-prescription').value;
            const token = localStorage.getItem('token');

            const res = await fetch('/api/medecin/consultation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ rdv_id, symptomes, diagnostic, prescription })
            });

            if (res.ok) {
                alert("Consultation enregistrée !");
                document.getElementById('consult-symptomes').value = '';
                document.getElementById('consult-diagnostic').value = '';
                document.getElementById('consult-prescription').value = '';
                document.getElementById('btn-save-consult').disabled = true;
                loadMedecinData();
            }
        }

        checkAuth();
    </script>
</body>
</html>
