<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santé App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Santé App</h1>
        <div id="user-info" class="hidden flex items-center gap-4">
            <span id="user-display" class="font-semibold text-gray-700"></span>
            <button onclick="logout()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">Déconnexion</button>
        </div>
    </nav>

    <div class="container mx-auto mt-8 p-4">
        <!-- Auth Container -->
        <div id="auth-container" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
            <h2 id="auth-title" class="text-xl font-bold mb-4 text-center">Connexion</h2>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div id="name-fields" class="hidden mb-4">
                    <label class="block text-sm font-medium text-gray-700">Nom</label>
                    <input type="text" id="nom" class="w-full border p-2 rounded mt-1">
                    <label class="block text-sm font-medium text-gray-700 mt-2">Prénom</label>
                    <input type="text" id="prenom" class="w-full border p-2 rounded mt-1">
                    <label class="block text-sm font-medium text-gray-700 mt-2">Rôle</label>
                    <select id="role" class="w-full border p-2 rounded mt-1">
                        <option value="PATIENT">Patient</option>
                        <option value="MEDECIN">Médecin</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" required class="w-full border p-2 rounded mt-1">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
                    <input type="password" id="password" required class="w-full border p-2 rounded mt-1">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-bold">Se connecter</button>
            </form>
            <p class="text-sm text-center mt-4">
                <a href="#" id="toggle-auth" onclick="toggleAuthMode()" class="text-blue-600 hover:underline">Pas encore de compte ? S'inscrire</a>
            </p>
        </div>

        <!-- Dashboard Médecin -->
        <div id="medecin-dashboard" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold">Rendez-vous à honorer</h3>
                    <button onclick="loadMedecinData()" class="px-3 py-1 text-sm bg-gray-200 rounded hover:bg-gray-300">↻ Actualiser</button>
                </div>
                <div id="rdv-list" class="space-y-3"></div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-lg font-bold mb-4">Nouvelle Consultation</h3>
                <form onsubmit="submitConsultation(event)" class="space-y-4">
                    <input type="hidden" id="consult-rdv-id">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Patient</label>
                        <input type="text" id="consult-patient-name" disabled class="w-full border p-2 rounded bg-gray-100">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Symptômes</label>
                        <textarea id="consult-symptomes" required class="w-full border p-2 rounded h-20"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Diagnostic</label>
                        <textarea id="consult-diagnostic" required class="w-full border p-2 rounded h-20"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Prescription / Ordonnance</label>
                        <textarea id="consult-prescription" class="w-full border p-2 rounded h-20"></textarea>
                    </div>
                    <button type="submit" id="btn-save-consult" disabled class="w-full bg-green-700 text-white p-2 rounded hover:bg-green-800 disabled:opacity-50 font-bold">Enregistrer la consultation</button>
                </form>
            </div>
        </div>

        <!-- Dashboard Patient -->
        <div id="patient-dashboard" class="hidden max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
            <h3 class="text-xl font-bold mb-4 text-gray-800">Espace Patient</h3>
            <p class="text-gray-600">Bienvenue dans votre espace. Vos rendez-vous et consultations seront visibles ici.</p>
        </div>
    </div>

    <script>
        let isRegister = false;

        function checkAuth() {
            const token = localStorage.getItem('token');
            const role = localStorage.getItem('role');
            const nom = localStorage.getItem('nom');
            const prenom = localStorage.getItem('prenom');

            if (token) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-display').innerText = `${role === 'MEDECIN' ? 'Dr. ' : ''}${prenom} ${nom}`;

                if (role === 'MEDECIN') {
                    document.getElementById('medecin-dashboard').classList.remove('hidden');
                    document.getElementById('patient-dashboard').classList.add('hidden');
                    loadMedecinData();
                } else {
                    document.getElementById('patient-dashboard').classList.remove('hidden');
                    document.getElementById('medecin-dashboard').classList.add('hidden');
                }
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('medecin-dashboard').classList.add('hidden');
                document.getElementById('patient-dashboard').classList.add('hidden');
            }
        }

        function toggleAuthMode() {
            isRegister = !isRegister;
            document.getElementById('auth-title').innerText = isRegister ? "Inscription" : "Connexion";
            document.getElementById('auth-btn').innerText = isRegister ? "S'inscrire" : "Se connecter";
            document.getElementById('toggle-auth').innerText = isRegister ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
            document.getElementById('name-fields').classList.toggle('hidden', !isRegister);
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
            const body = isRegister ? {
                email, password,
                nom: document.getElementById('nom').value,
                prenom: document.getElementById('prenom').value,
                role: document.getElementById('role').value
            } : { email, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) {
                    if (isRegister) {
                        alert("Compte créé avec succès ! Connectez-vous.");
                        toggleAuthMode();
                    } else {
                        localStorage.setItem('token', data.access_token);
                        localStorage.setItem('role', data.role);
                        localStorage.setItem('nom', data.nom);
                        localStorage.setItem('prenom', data.prenom);
                        checkAuth();
                    }
                } else {
                    alert(data.detail || "Erreur lors de l'authentification.");
                }
            } catch (err) {
                alert("Erreur réseau: " + err.message);
            }
        }

        function logout() {
            localStorage.clear();
            checkAuth();
        }

        async function loadMedecinData() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch('/api/medecin/rdv', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) return;

                const rdvs = await res.json();
                const listContainer = document.getElementById('rdv-list');
                listContainer.innerHTML = '';

                if (rdvs.length === 0) {
                    listContainer.innerHTML = '<p class="text-gray-500 text-sm">Aucun rendez-vous trouvé.</p>';
                    return;
                }

                rdvs.forEach(rdv => {
                    const isTermine = rdv.statut === 'TERMINE';
                    const badgeClass = isTermine ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                    
                    const card = document.createElement('div');
                    card.className = `p-4 border rounded-lg flex justify-between items-center ${isTermine ? 'bg-gray-50 opacity-75' : 'bg-white shadow-sm'}`;
                    card.innerHTML = `
                        <div>
                            <h4 class="font-bold text-gray-800">${rdv.nom_patient} ${rdv.prenom_patient}</h4>
                            <p class="text-sm text-gray-600">Motif : ${rdv.motif}</p>
                            <span class="inline-block mt-1 px-2 py-1 text-xs font-semibold rounded ${badgeClass}">${rdv.statut}</span>
                        </div>
                        ${!isTermine ? `
                            <button onclick="selectRdv(${rdv.id}, '${rdv.nom_patient} ${rdv.prenom_patient}')" 
                                    class="px-3 py-1 bg-blue-600 text-white text-sm rounded hover:bg-blue-700">
                                Consulter
                            </button>
                        ` : '<span class="text-xs text-green-600 font-semibold">Consulté</span>'}
                    `;
                    listContainer.appendChild(card);
                });
            } catch (err) {
                console.error("Erreur chargement RDV:", err);
            }
        }

        function selectRdv(id, patientName) {
            document.getElementById('consult-rdv-id').value = id;
            document.getElementById('consult-patient-name').value = patientName;
            document.getElementById('btn-save-consult').disabled = false;
        }

        async function submitConsultation(e) {
            e.preventDefault();
            const rdv_id = parseInt(document.getElementById('consult-rdv-id').value);
            const symptomes = document.getElementById('consult-symptomes').value;
            const diagnostic = document.getElementById('consult-diagnostic').value;
            const prescription = document.getElementById('consult-prescription').value;
            const token = localStorage.getItem('token');

            try {
                const res = await fetch('/api/medecin/consultation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ rdv_id, symptomes, diagnostic, prescription })
                });

                if (res.ok) {
                    alert("Consultation enregistrée avec succès !");
                    document.getElementById('consult-rdv-id').value = '';
                    document.getElementById('consult-patient-name').value = '';
                    document.getElementById('consult-symptomes').value = '';
                    document.getElementById('consult-diagnostic').value = '';
                    document.getElementById('consult-prescription').value = '';
                    document.getElementById('btn-save-consult').disabled = true;
                    loadMedecinData();
                } else {
                    const errData = await res.json();
                    alert("Erreur API: " + JSON.stringify(errData.detail || errData));
                }
            } catch (err) {
                alert("Erreur réseau: " + err.message);
            }
        }

        checkAuth();
    </script>
</body>
</html>
