<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santé App - Portail Médical</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <!-- En-tête Principal -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl font-black tracking-wider text-indigo-400">SantéApp</span>
                <span class="text-xs bg-indigo-800 text-indigo-200 px-2 py-1 rounded">Espace Sécurisé</span>
            </div>

            <div id="user-session" class="hidden flex items-center gap-4">
                <div class="text-right">
                    <p id="user-display-name" class="font-bold text-sm text-white"></p>
                    <p id="user-display-role" class="text-xs text-indigo-300"></p>
                </div>
                <button onclick="logout()" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-sm rounded-md transition font-medium">
                    Déconnexion
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto mt-8 px-4 flex-grow">

        <!-- 1. PORTAIL AUTHENTIFICATION (Page d'accueil si non connecté) -->
        <div id="auth-portal" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg border border-slate-200">
            <div class="text-center mb-6">
                <h2 id="auth-title" class="text-2xl font-bold text-slate-800">Connexion au Portail</h2>
                <p class="text-sm text-slate-500 mt-1">Veuillez vous identifier pour accéder à votre espace</p>
            </div>

            <form onsubmit="handleAuth(event)" class="space-y-4">
                <div id="register-fields" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nom</label>
                        <input type="text" id="nom" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Prénom</label>
                        <input type="text" id="prenom" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Rôle</label>
                        <select id="role" onchange="toggleSpecialite()" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="PATIENT">Patient</option>
                            <option value="MEDECIN">Médecin / Praticien</option>
                        </select>
                    </div>
                    <div id="specialite-container" class="hidden">
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Spécialité Médicale</label>
                        <select id="specialite" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Généraliste">Généraliste</option>
                            <option value="Cardiologue">Cardiologue</option>
                            <option value="Anesthésiste">Anesthésiste</option>
                            <option value="Pédiatre">Pédiatre</option>
                            <option value="Dermatologue">Dermatologue</option>
                            <option value="Gyneco-Obstétricien">Gyneco-Obstétricien</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Adresse Email</label>
                    <input type="email" id="email" required class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Mot de passe</label>
                    <input type="password" id="password" required class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <button type="submit" id="auth-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3 rounded-lg transition shadow-md">
                    Se Connecter
                </button>
            </form>

            <div class="text-center mt-6 pt-4 border-t border-slate-100">
                <a href="#" id="toggle-auth" onclick="toggleAuthMode()" class="text-sm font-semibold text-indigo-600 hover:underline">
                    Créer un compte
                </a>
            </div>
        </div>

        <!-- 2. ESPACE MÉDECIN (Visible uniquement si Médecin connecté) -->
        <div id="medecin-dashboard" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                <div class="flex justify-between items-center mb-6 border-b pb-3">
                    <h3 class="text-lg font-bold text-slate-800">Mes Rendez-vous attribués</h3>
                    <button onclick="loadMedecinData()" class="px-3 py-1 bg-slate-100 text-slate-700 text-sm rounded hover:bg-slate-200 transition">↻ Actualiser</button>
                </div>
                <div id="rdv-list" class="space-y-4"></div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                <h3 class="text-lg font-bold text-slate-800 mb-6 border-b pb-3">Dossier de Consultation</h3>
                <form onsubmit="submitConsultation(event)" class="space-y-4">
                    <input type="hidden" id="consult-rdv-id">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Patient</label>
                        <input type="text" id="consult-patient-name" disabled class="w-full border p-2.5 rounded-lg bg-slate-100 font-semibold text-slate-700">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Symptômes constatés</label>
                        <textarea id="consult-symptomes" required class="w-full border p-2.5 rounded-lg h-20 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Diagnostic Médical</label>
                        <textarea id="consult-diagnostic" required class="w-full border p-2.5 rounded-lg h-20 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Prescription / Ordonnance</label>
                        <textarea id="consult-prescription" class="w-full border p-2.5 rounded-lg h-20 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                    </div>
                    <button type="submit" id="btn-save-consult" disabled class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold p-3 rounded-lg transition shadow-md">
                        Valider et enregistrer la consultation
                    </button>
                </form>
            </div>
        </div>

        <!-- 3. ESPACE PATIENT (Visible uniquement si Patient connecté) -->
        <div id="patient-dashboard" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                <h3 class="text-lg font-bold text-slate-800 mb-6 border-b pb-3">Prendre RDV auprès d'un Spécialiste</h3>
                <form onsubmit="submitPatientRdv(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Choisir un Médecin</label>
                        <select id="select-medecin" required class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Motif de Consultation</label>
                        <input type="text" id="patient-motif" required class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ex: Fièvre prolongée, Bilan de routine...">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3 rounded-lg transition shadow-md">
                        Confirmer le Rendez-vous
                    </button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                <h3 class="text-lg font-bold text-slate-800 mb-6 border-b pb-3">Mon Historique Médical</h3>
                <div id="patient-rdv-list" class="space-y-4"></div>
            </div>
        </div>

    </main>

    <script>
        let isRegister = false;

        function checkAuth() {
            const token = localStorage.getItem('token');
            const role = (localStorage.getItem('role') || '').toUpperCase();
            const nom = localStorage.getItem('nom') || '';
            const prenom = localStorage.getItem('prenom') || '';

            // Masquer tout par défaut
            document.getElementById('auth-portal').classList.add('hidden');
            document.getElementById('user-session').classList.add('hidden');
            document.getElementById('medecin-dashboard').classList.add('hidden');
            document.getElementById('patient-dashboard').classList.add('hidden');

            if (token && role) {
                document.getElementById('user-session').classList.remove('hidden');
                document.getElementById('user-display-name').innerText = role === 'MEDECIN' ? `Dr. ${prenom} ${nom}` : `${prenom} ${nom}`;
                document.getElementById('user-display-role').innerText = role === 'MEDECIN' ? 'Médecin / Praticien' : 'Patient';

                if (role === 'MEDECIN') {
                    document.getElementById('medecin-dashboard').classList.remove('hidden');
                    loadMedecinData();
                } else if (role === 'PATIENT') {
                    document.getElementById('patient-dashboard').classList.remove('hidden');
                    loadPatientData();
                }
            } else {
                document.getElementById('auth-portal').classList.remove('hidden');
            }
        }

        function toggleAuthMode() {
            isRegister = !isRegister;
            document.getElementById('auth-title').innerText = isRegister ? "Inscription Portail" : "Connexion au Portail";
            document.getElementById('auth-btn').innerText = isRegister ? "S'inscrire" : "Se Connecter";
            document.getElementById('toggle-auth').innerText = isRegister ? "Déjà un compte ? Se connecter" : "Créer un compte";
            document.getElementById('register-fields').classList.toggle('hidden', !isRegister);
        }

        function toggleSpecialite() {
            const roleSelect = document.getElementById('role').value;
            document.getElementById('specialite-container').classList.toggle('hidden', roleSelect !== 'MEDECIN');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
            const body = isRegister ? {
                email, password,
                nom: document.getElementById('nom').value,
                prenom: document.getElementById('prenom').value,
                role: document.getElementById('role').value,
                specialite: document.getElementById('role').value === 'MEDECIN' ? document.getElementById('specialite').value : null
            } : { email, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) {
                    if (isRegister) {
                        alert("Compte créé ! Connectez-vous.");
                        toggleAuthMode();
                    } else {
                        localStorage.setItem('token', data.access_token);
                        localStorage.setItem('role', data.role);
                        localStorage.setItem('nom', data.nom || '');
                        localStorage.setItem('prenom', data.prenom || '');
                        checkAuth();
                    }
                } else {
                    alert(data.detail || "Erreur lors de l'authentification");
                }
            } catch (err) {
                alert("Erreur réseau: " + err.message);
            }
        }

        function logout() {
            localStorage.clear();
            checkAuth();
        }

        // PATIENT LOGIC
        async function loadPatientData() {
            const token = localStorage.getItem('token');
            const resMed = await fetch('/api/patient/medecins');
            const medecins = await resMed.json();
            const selectMed = document.getElementById('select-medecin');

            if (medecins.length === 0) {
                selectMed.innerHTML = '<option value="">Aucun médecin disponible</option>';
            } else {
                selectMed.innerHTML = medecins.map(m => 
                    `<option value="${m.id}">Dr. ${m.prenom} ${m.nom} (${m.specialite})</option>`
                ).join('');
            }

            const resRdv = await fetch('/api/patient/my-rdv', { headers: { 'Authorization': `Bearer ${token}` } });
            if (!resRdv.ok) return;
            const rdvs = await resRdv.json();
            const list = document.getElementById('patient-rdv-list');
            list.innerHTML = rdvs.length === 0 ? '<p class="text-slate-500 text-sm">Aucun rendez-vous dans votre dossier.</p>' : '';

            rdvs.forEach(r => {
                const card = document.createElement('div');
                card.className = "p-4 border rounded-lg bg-slate-50 shadow-sm space-y-2";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-bold text-slate-800">${r.medecin_nom}</span>
                            <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded ml-2">${r.specialite}</span>
                            <p class="text-sm text-slate-600 mt-1">Motif: ${r.motif}</p>
                        </div>
                        <span class="px-2.5 py-1 text-xs font-semibold rounded ${r.statut === 'TERMINE' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${r.statut}</span>
                    </div>
                    ${r.diagnostic ? `
                        <div class="text-xs bg-white p-3 rounded border border-slate-200 mt-2 space-y-1">
                            <p><strong>Diagnostic:</strong> ${r.diagnostic}</p>
                            <p><strong>Prescription:</strong> ${r.prescription || 'Aucune'}</p>
                        </div>
                    ` : ''}
                `;
                list.appendChild(card);
            });
        }

        async function submitPatientRdv(e) {
            e.preventDefault();
            const medecin_id = parseInt(document.getElementById('select-medecin').value);
            const motif = document.getElementById('patient-motif').value;
            const token = localStorage.getItem('token');

            const res = await fetch('/api/patient/rdv', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ medecin_id, motif })
            });

            if (res.ok) {
                alert("Rendez-vous enregistré avec succès !");
                document.getElementById('patient-motif').value = '';
                loadPatientData();
            }
        }

        // MEDECIN LOGIC
        async function loadMedecinData() {
            const token = localStorage.getItem('token');
            const res = await fetch('/api/medecin/rdv', { headers: { 'Authorization': `Bearer ${token}` } });
            if (!res.ok) return;
            const rdvs = await res.json();
            const listContainer = document.getElementById('rdv-list');
            listContainer.innerHTML = rdvs.length === 0 ? '<p class="text-slate-500 text-sm">Aucun rendez-vous attribué.</p>' : '';

            rdvs.forEach(rdv => {
                const isTermine = rdv.statut === 'TERMINE';
                const card = document.createElement('div');
                card.className = `p-4 border rounded-lg flex justify-between items-center ${isTermine ? 'bg-slate-50 border-slate-200' : 'bg-white border-indigo-100 shadow-sm'}`;
                card.innerHTML = `
                    <div>
                        <h4 class="font-bold text-slate-800">${rdv.prenom_patient} ${rdv.nom_patient}</h4>
                        <p class="text-sm text-slate-600">Motif : ${rdv.motif}</p>
                        <span class="inline-block px-2 py-0.5 text-xs font-semibold rounded mt-1 ${isTermine ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${rdv.statut}</span>
                    </div>
                    ${!isTermine ? `<button onclick="selectRdv(${rdv.id}, '${rdv.prenom_patient} ${rdv.nom_patient}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded shadow-sm">Consulter</button>` : '<span class="text-xs text-emerald-600 font-semibold">Consulté</span>'}
                `;
                listContainer.appendChild(card);
            });
        }

        function selectRdv(id, name) {
            document.getElementById('consult-rdv-id').value = id;
            document.getElementById('consult-patient-name').value = name;
            document.getElementById('btn-save-consult').disabled = false;
        }

        async function submitConsultation(e) {
            e.preventDefault();
            const rdv_id = parseInt(document.getElementById('consult-rdv-id').value);
            const symptomes = document.getElementById('consult-symptomes').value;
            const diagnostic = document.getElementById('consult-diagnostic').value;
            const prescription = document.getElementById('consult-prescription').value;
            const token = localStorage.getItem('token');

            const res = await fetch('/api/medecin/consultation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ rdv_id, symptomes, diagnostic, prescription })
            });

            if (res.ok) {
                alert("Consultation enregistrée !");
                document.getElementById('consult-symptomes').value = '';
                document.getElementById('consult-diagnostic').value = '';
                document.getElementById('consult-prescription').value = '';
                document.getElementById('btn-save-consult').disabled = true;
                loadMedecinData();
            }
        }

        checkAuth();
    </script>
</body>
</html>
