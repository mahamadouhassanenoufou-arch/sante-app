<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Santé App PWA</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen pb-20 select-none">

    <!-- En-tête Fixe (Header) -->
    <header class="sticky top-0 z-10 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex justify-between items-center shadow-sm">
        <h1 class="text-lg font-bold text-slate-800">Santé App</h1>
        <div id="status-indicator" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
            En ligne
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Carte Formulaire -->
        <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm space-y-4">
            <h2 class="text-base font-semibold text-slate-700">Nouvelle Saisie</h2>
            
            <form id="data-form" class="space-y-3">
                <div>
                    <label for="title" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Titre / Sujet</label>
                    <input type="text" id="title" required 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition">
                </div>

                <div>
                    <label for="details" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Détails / Notes</label>
                    <input type="text" id="details" required 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition">
                </div>

                <!-- Groupe de Boutons d'Action (Hiérarchisés) -->
                <div class="pt-2 flex gap-3">
                    <button type="button" onclick="document.getElementById('data-form').reset()"
                            class="flex-1 py-3 px-4 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-sm font-semibold rounded-xl transition">
                        Annuler
                    </button>
                    <button type="submit" 
                            class="flex-1 py-3 px-4 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-md shadow-blue-500/20 transition">
                        Enregistrer
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- Barre de Navigation Inférieure Fixe (Style Mobile Native) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-around items-center z-20">
        <button class="flex flex-col items-center gap-1 text-blue-600 active:scale-90 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="text-[10px] font-medium">Accueil</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 active:scale-90 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            <span class="text-[10px] font-medium">Dossiers</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 active:scale-90 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span class="text-[10px] font-medium">Réglages</span>
        </button>
    </nav>

    <script src="/static/app.js"></script>
</body>
</html>
