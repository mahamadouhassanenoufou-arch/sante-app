<div class="max-w-md mx-auto p-4 space-y-4">
    <!-- Sélecteur de profil -->
    <div class="bg-slate-200 p-1 rounded-xl flex">
        <button id="btn-patient" onclick="switchRole('patient')" 
                class="flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow-sm text-blue-600 transition">
            Espace Patient
        </button>
        <button id="btn-medecin" onclick="switchRole('medecin')" 
                class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition">
            Espace Médecin
        </button>
    </div>

    <!-- Vue Patient -->
    <div id="view-patient" class="space-y-3">
        <div class="bg-blue-600 text-white p-4 rounded-2xl shadow-md">
            <p class="text-xs opacity-80">Prochain Rendez-vous</p>
            <p class="text-base font-bold">Dr. Abdoulaye - Cardiologie</p>
            <p class="text-xs mt-1">Demain à 09:30</p>
        </div>
        <button class="w-full py-3 bg-blue-50 text-blue-600 font-semibold rounded-xl border border-blue-200">
            + Prendre un nouveau rendez-vous
        </button>
    </div>

    <!-- Vue Médecin (Cachée par défaut) -->
    <div id="view-medecin" class="space-y-3 hidden">
        <div class="bg-slate-900 text-white p-4 rounded-2xl shadow-md flex justify-between items-center">
            <div>
                <p class="text-xs text-slate-400">Consultations aujourd'hui</p>
                <p class="text-xl font-bold">8 Patients</p>
            </div>
            <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs rounded-full">En cours</span>
        </div>
        <button class="w-full py-3 bg-slate-900 text-white font-semibold rounded-xl shadow-md">
            + Nouvelle Consultation
        </button>
    </div>
</div>

<script>
function switchRole(role) {
    const viewPatient = document.getElementById('view-patient');
    const viewMedecin = document.getElementById('view-medecin');
    const btnPatient = document.getElementById('btn-patient');
    const btnMedecin = document.getElementById('btn-medecin');

    if (role === 'patient') {
        viewPatient.classList.remove('hidden');
        viewMedecin.classList.add('hidden');
        btnPatient.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow-sm text-blue-600 transition";
        btnMedecin.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";
    } else {
        viewPatient.classList.add('hidden');
        viewMedecin.classList.remove('hidden');
        btnMedecin.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow-sm text-slate-900 transition";
        btnPatient.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";
    }
}
</script>
